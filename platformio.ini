; Spotify Hologram Cube - PlatformIO config
; Pick the env that matches your board:
;   cyd      -> original ESP32-2432S028R (one micro-USB port, ILI9341 screen)
;   cyd2usb  -> "2 USB" version (micro-USB + USB-C, ST7789 screen)

[platformio]
default_envs = cyd

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
	bblanchon/ArduinoJson@^6.21.5
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.1.0
	https://github.com/witnessmenow/spotify-api-arduino.git
build_flags =
	-DUSER_SETUP_LOADED
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DUSE_HSPI_PORT
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_GFXFF
	-DSMOOTH_FONT=0

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
